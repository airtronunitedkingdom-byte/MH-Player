name: MH Player Windows Self-Hosted Build
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Locate Android SDK
        run: |
          if (-not $env:ANDROID_HOME -and -not $env:ANDROID_SDK_ROOT) {
            $sdk = 'C:\\Users\\Administrator\\AppData\\Local\\Android\\Sdk'
            if (Test-Path $sdk) {
              "ANDROID_HOME=$sdk" >> $env:GITHUB_ENV
              "ANDROID_SDK_ROOT=$sdk" >> $env:GITHUB_ENV
              Write-Host "Found Android SDK: $sdk"
            } else {
              throw "Android SDK not found. Configure a shared SDK path accessible by the runner service."
            }
          }
          gradle --version
      - name: Set unique version code
        run: |
          $code = 10000 + ${{ github.run_number }}
          "MH_VERSION_CODE=$code" >> $env:GITHUB_ENV
          Write-Host "Play version code: $code"
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MH_KEYSTORE_BASE64 }}
          MH_KEYSTORE_PASSWORD: ${{ secrets.MH_KEYSTORE_PASSWORD }}
          MH_KEY_ALIAS: ${{ secrets.MH_KEY_ALIAS }}
          MH_KEY_PASSWORD: ${{ secrets.MH_KEY_PASSWORD }}
        run: |
          if (-not $env:KEYSTORE_BASE64 -or -not $env:MH_KEYSTORE_PASSWORD -or -not $env:MH_KEY_ALIAS -or -not $env:MH_KEY_PASSWORD) { throw "Missing MH Player signing secrets." }
          $path = Join-Path $env:RUNNER_TEMP 'mh-release.jks'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "MH_KEYSTORE_PATH=$path" >> $env:GITHUB_ENV
      - name: Build signed AAB
        env:
          MH_KEYSTORE_PASSWORD: ${{ secrets.MH_KEYSTORE_PASSWORD }}
          MH_KEY_ALIAS: ${{ secrets.MH_KEY_ALIAS }}
          MH_KEY_PASSWORD: ${{ secrets.MH_KEY_PASSWORD }}
        run: gradle :app:bundleRelease --no-daemon
      - name: Publish APK and signed AAB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-${{ github.run_id }}-${{ github.run_attempt }}"
          gh release create $tag "app/build/outputs/apk/debug/app-debug.apk" "app/build/outputs/bundle/release/app-release.aab" --title "MH Player Windows Build - $tag" --notes "Self-hosted build: debug APK and signed release AAB." --prerelease --target "${{ github.sha }}"
      - name: Remove temporary signing keystore
        if: always()
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'mh-release.jks'
          if (Test-Path $path) { Remove-Item $path -Force }
